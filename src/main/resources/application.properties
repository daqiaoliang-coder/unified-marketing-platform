spring.application.name=unified-marketing-platform
server.address=127.0.0.1
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/marketing;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-null-for-primitives=true
server.error.include-message=never
server.error.include-stacktrace=never
marketing.events.delay-ms=1000
